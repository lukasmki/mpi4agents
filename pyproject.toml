[project]
name = "mpi4agents"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "lukasmki", email = "lukasarus@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "mpi4py>=4.1.1",
    "pydantic-ai>=1.52.0",
    "python-dotenv>=1.2.1",
    "rich>=14.3.2",
]

[project.scripts]
mpi4agents = "mpi4agents:main"

[build-system]
requires = ["uv_build>=0.9.9,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "furo>=2025.12.19",
    "sphinx>=9.1.0",
]
